name: Type check and Build

on:
  push:
    paths:
      - "**.py"
      - "**.html"
      - "**.yml"
      - "uv.lock"
      - "Dockerfile"
      - "alembic.ini"
      - "justfile"
      - "deploy/**"
  release:
    types: [created]
  pull_request:
    paths:
      - "**.py"
      - "**.html"
      - "**.yml"
      - "uv.lock"
      - "Dockerfile"
      - "alembic.ini"
      - "justfile"
      - "deploy/**"

jobs:
  test:
    name: Test types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: jdx/mise-action@v4

      - run: uv sync --all-extras

      - name: Test typing and format
        run: |
          just test

      - name: Check SQLite Alembic Migrations
        run: |
          just upgrade
          just check
          just downgrade
          just upgrade
          just check

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Determine API tags
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            # Remove leading 'v' if present
            VERSION="${VERSION#v}"
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            echo "tags=${{ secrets.DOCKER_HUB_USERNAME }}/vvzapi:$VERSION,${{ secrets.DOCKER_HUB_USERNAME }}/vvzapi:$MAJOR.$MINOR,${{ secrets.DOCKER_HUB_USERNAME }}/vvzapi:$MAJOR,${{ secrets.DOCKER_HUB_USERNAME }}/vvzapi:latest" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ secrets.DOCKER_HUB_USERNAME }}/vvzapi:nightly" >> $GITHUB_OUTPUT
            github_sha_hash=${{ github.sha }}
            echo "version=nightly:${github_sha_hash:0:7}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          file: deploy/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}

      - name: Determine scraper tags
        id: vars-scraper
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            # Remove leading 'v' if present
            VERSION="${VERSION#v}"
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            echo "tags=${{ secrets.DOCKER_HUB_USERNAME }}/vvzapi-scraper:$VERSION,${{ secrets.DOCKER_HUB_USERNAME }}/vvzapi-scraper:$MAJOR.$MINOR,${{ secrets.DOCKER_HUB_USERNAME }}/vvzapi-scraper:$MAJOR,${{ secrets.DOCKER_HUB_USERNAME }}/vvzapi-scraper:latest" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ secrets.DOCKER_HUB_USERNAME }}/vvzapi-scraper:nightly" >> $GITHUB_OUTPUT
            github_sha_hash=${{ github.sha }}
            echo "version=nightly:${github_sha_hash:0:7}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push scraper
        uses: docker/build-push-action@v5
        with:
          file: deploy/Dockerfile.scraper
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars-scraper.outputs.tags }}
          build-args: |
            VERSION=${{ steps.vars-scraper.outputs.version }}

  backup:
    name: Attach live database dump
    # Runs in parallel with the build so the snapshot is taken as close to the release as possible.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download live database dump
        id: dump
        run: |
          # Soft backup only (~60MB) - a failure must never block the release.
          asset="database-${{ github.event.release.tag_name }}.zip"
          if curl \
            --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            --output "$asset" https://vvzapi.ch/api/v0/dump; then
            echo "asset=$asset" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not download the live database dump; skipping release asset."
          fi

      - name: Attach dump to release
        # Empty output means the download failed, in which case there is nothing to attach.
        if: steps.dump.outputs.asset != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.dump.outputs.asset }}" --clobber
