[project]
name = "vvzapi"
version = "2.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "jinja2>=3.1.6",
    "jinja2-htmlmin>=1.1.0",
    "jinja2-pluralize>=0.3.0",
    "jinjax>=0.66",
    "mcp>=2.3.0,<3",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyparsing>=3.3.3",
    "rapidfuzz>=3.14.6",
    "scrapy>=2.19.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "djlint>=1.47.0",
    "ruff>=0.17.2",
]

[tool.basedpyright]
typeCheckingMode = "all"
include = ["api", "scraper"]
reportDeprecated = false
reportUninitializedInstanceVariable = false
reportUnusedCallResult = false
allowedUntypedLibraries = ["jinja2_pluralize", "slowapi", "jinjax", "opentelemetry"]

[tool.djlint]
profile = "django"
extension = "jinja"
ignore = "H021,D004,D018"
format_js=true
format_css=true
line_break_after_multiline_tag=true
max_blank_lines=1
ignore_case=true
