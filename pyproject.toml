[project]
name = "vvzapi"
version = "1.12.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
    "jinja2>=3.1.6",
    "jinja2-htmlmin>=1.1.0",
    "jinja2-pluralize>=0.3.0",
    "jinjax>=0.63",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "pyparsing>=3.3.2",
    "rapidfuzz>=3.14.5",
    "scrapy>=2.15.2",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.38",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "djlint>=1.36.4",
    "ruff>=0.15.12",
]

[tool.basedpyright]
typeCheckingMode = "all"
include = ["api", "scraper"]
reportDeprecated = false
reportUninitializedInstanceVariable = false
reportUnusedCallResult = false
allowedUntypedLibraries = ["jinja2_pluralize", "slowapi", "jinjax", "opentelemetry"]

[tool.djlint]
profile = "django"
ignore = "H021"
format_js=true
format_css=true
line_break_after_multiline_tag=true
max_blank_lines=1
ignore_case=true
